# One service per course environment on the dev VM. Add a new environment =
# add a new service block below, then re-run ./deploy.sh.
#
# Each service is tagged with a Compose profile (gios, sat, ...). Only services
# whose profile is in COMPOSE_PROFILES start; unlisted profiles stay dormant.
# See docs/ENVIRONMENTS.md for the available profiles.
#
# This file is the source of truth for host SSH ports. Adding a service here
# also opens its port in the NSG (filtered to active profiles).
#
# /var/lib/dev-vm/authorized_keys is a symlink that the CSE bootstrap creates
# on the VM, pointing at the admin user's authorized_keys. Using a fixed
# path here means the bind-mount target stays admin-user-agnostic.

services:
  gios-env:
    build: ./gios-env
    container_name: gios-env
    profiles: [gios]
    ports:
      - "2222:22"
    restart: unless-stopped
    volumes:
      - /var/lib/dev-vm/authorized_keys:/etc/ssh/authorized_keys:ro

  sat-env:
    build: ./sat-env
    container_name: sat-env
    profiles: [sat]
    ports:
      - "2223:22"
    restart: unless-stopped
    volumes:
      - /var/lib/dev-vm/authorized_keys:/etc/ssh/authorized_keys:ro
